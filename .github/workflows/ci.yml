name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      # Format drift in untouched files is tracked separately; fail on real lint errors only.
      - run: npx eslint src --rule 'prettier/prettier: off'
      - run: npx vite build
      - name: Order-integrity tests (migrations on in-memory Postgres)
        run: |
          npm i --no-save @electric-sql/pglite
          node supabase/tests/order-integrity.test.mjs
